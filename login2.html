<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.:: Página Login - Super Mario Bros ::.</title>
    <!-- Fonte arredondada com estética de desenho/filme animado -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', 'Arial Black', sans-serif;
        }

        /* Centralização total da tela (horizontal e vertical) */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Cenário clássico do Mario: Céu azul e colinas verdes */
            background: linear-gradient(180deg, #5c94fc 0%, #8ab5ff 62%, #61a044 62%, #4e8a34 100%);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Título com relevo e sombra 3D característica do logo do Mario */
        h1 {
            color: #fcd116; /* Amarelo de moedas/estrelas */
            font-size: 2.8rem;
            text-align: center;
            margin-bottom: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 
                3px 3px 0 #e52521,
                -3px -3px 0 #e52521,
                3px -3px 0 #e52521,
                -3px 3px 0 #e52521,
                0px 6px 0 #000000,
                4px 8px 12px rgba(0, 0, 0, 0.4);
        }

        /* Card do formulário estilizado como bloco temático */
        form {
            background-color: #ffffff;
            width: 100%;
            padding: 35px 30px;
            border-radius: 24px;
            border: 5px solid #e52521; /* Vermelho Mario */
            box-shadow: 
                0 10px 0 #9e100e, 
                0 18px 25px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Selo com a estrela amarela sobre o topo do formulário */
        form::before {
            content: "★";
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffd700;
            color: #b38600;
            font-size: 24px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 4px 0 #b38600, 0 6px 10px rgba(0, 0, 0, 0.25);
        }

        label {
            color: #003399; /* Azul clássico */
            font-size: 1.15rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        /* Campos de texto com bordas arredondadas e feedback de foco */
        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 1rem;
            font-weight: 600;
            border: 3px solid #ffcc00;
            background-color: #fffde7;
            border-radius: 14px;
            outline: none;
            transition: all 0.2s ease-in-out;
            color: #333333;
        }

        input:focus {
            border-color: #e52521;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(229, 37, 33, 0.25);
            transform: scale(1.02);
        }

        /* Botão estilo arcade/bloco 3D verde Luigi (1-UP) com animação de clique */
        button {
            margin-top: 8px;
            padding: 14px 20px;
            background-color: #43b047; /* Verde Luigi */
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 6px 0 #28742b, 0 10px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.1s ease-in-out;
        }

        button:hover {
            background-color: #4cd451;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #28742b, 0 12px 18px rgba(0, 0, 0, 0.35);
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #28742b, 0 4px 6px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <form action="frontend.html" method="GET"> <!--esta tag insere um formulário em uma página web-->
            <label for="usuario">Login</label><!--label é o rótulo do campo-->
            <input id="usuario" name="usuario" pattern="admin" title="Usuário: admin" required>
            
            <label for="senha">Senha</label>
            <input id="senha" type="password" name="senha" pattern="1234" title="Senha: 1234" required>
            
            <button type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
