<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.:: Página Login - My first Form Web ::.</title>
</head>
<body>
    <h1>Login</h1>
    <form action="frontend.html" method="GET"> <!--esta tag insere um formulário em uma página web-->
    <label for="usuario">Login</label><!--label é o rótulo do campo-->
    <input id="usuario" name="usuario" pattern="admin" title="Usuário: admin" required>
    <label for="senha">Senha</label>
    <input input id="senha" type="password" name="senha" pattern="1234" title="Senha: 1234" required>
    <button>Enviar</button>
</form>
</body>
</html>
